<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Pasaporte de Frases</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="boarding-pass">
    <div class="boarding-pass__top">
      <p class="eyebrow">Nuevo pasajero</p>
      <h2>Crear tu pasaporte</h2>
    </div>
    <div class="boarding-pass__body">
      <div id="mensaje" class="mensaje"></div>
      <form id="form-registro">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required autocomplete="name">
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--coral btn--full">Empezar el camino</button>
      </form>
      <p class="auth-switch">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  document.getElementById('form-registro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    await registrar(nombre, email, password);
  });
</script>

</body>
</html>
